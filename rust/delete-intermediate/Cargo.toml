[package]
name = "delete-intermediate"
version = "0.1.0"
edition = "2021"

[package.metadata.lambda.deploy]
memory = 512
timeout = 300

[dependencies]

futures = "0.3"
lambda_runtime = "1.0.1"
object_store = { version = "0.14", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[dev-dependencies]
tempfile = "3"
