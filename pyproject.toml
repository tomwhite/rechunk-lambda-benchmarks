[project]
name = "rechunk-lambda-benchmarks"
version = "0.1.0"
authors = [
    { name = "Tom White", email = "tom.e.white@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "boto3>=1.40.61",
    "click>=8.5.0",
    "map-lambda",
    "obstore>=0.11.1",
    "zarr>=3.3.0",
]

[tool.uv.sources]
map-lambda = { git = "https://github.com/tomwhite/map-lambda" }

[project.optional-dependencies]
diagnostics = [
    "map-lambda[diagnostics]",
]

[project.scripts]
rechunk-lambda-benchmarks = "rechunk_lambda_benchmarks.cli:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rechunk_lambda_benchmarks*"]

[tool.pytest.ini_options]
markers = [
    "lambda_integration: requires a local `cargo lambda watch` server",
]

[tool.coverage.run]
branch = true
source = ["rechunk_lambda_benchmarks", "tests"]
# vendored code is measured against upstream, not against our tests; the
# irregular planner in particular is deliberately never called
omit = ["rechunk_lambda_benchmarks/vendor/*"]

[tool.ruff]
line-length = 100
# vendored verbatim from rechunker and cubed, so it can be diffed against upstream
extend-exclude = ["rechunk_lambda_benchmarks/vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
files = ["rechunk_lambda_benchmarks", "tests"]
# see the ruff exclusion above: vendored code is not ours to annotate
exclude = ["rechunk_lambda_benchmarks/vendor"]
follow_imports_for_stubs = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["aioboto3.*", "boto3.*", "botocore.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rechunk_lambda_benchmarks.vendor.*"]
ignore_errors = true

[dependency-groups]
dev = [
    "rechunk-lambda-benchmarks[diagnostics]",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
